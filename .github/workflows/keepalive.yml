name: keepalive

# GitHub turns off scheduled workflows after 60 days without repository activity.
# This makes one tiny commit a month so the tracker's schedule never lapses.
on:
  schedule:
    - cron: "17 12 1 * *"   # 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive: keep scheduled tracker enabled [skip ci]"
          git push
